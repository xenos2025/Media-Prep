[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-prep"
version = "0.1.0"
description = "Project-neutral storefront media preparation workbench (images + videos)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "GRC Digital" }]
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
]

[project.optional-dependencies]
mozjpeg = ["mozjpeg-lossless-optimization>=1.0"]

[project.scripts]
media-prep = "media_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
